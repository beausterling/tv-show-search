<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Show Search</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>
<body>
  <nav>
    <div class="container nav__row">
      <a href="#" class="nav__logo">TV Show Search</a>
      <ul class="nav__links">
        <li><a href="#" class="nav__link">Home</a></li>
        <li><a href="#results" class="nav__link">Results</a></li>
      </ul>
    </div>
  </nav>

  <header>
    <div class="container">
      <h1 class="header__title">Browse our shows</h1>
      <form class="search">
        <label for="search-input" class="search__label">Search for a TV show</label>
        <div class="search__row">
          <input type="text" id="search-input" class="search__input" placeholder="e.g. The Office">
          <button type="submit" class="search__btn">Search</button>
        </div>
      </form>
    </div>
  </header>

  <main id="results">
    <div class="container">
      <div class="results__header">
        <h2 class="results__title">Search results</h2>
        <div class="results__controls">
          <label for="sort">Sort by</label>
          <select id="sort">
            <option value="" disabled selected>Sort</option>
            <option value="A_TO_Z">Title, A to Z</option>
            <option value="Z_TO_A">Title, Z to A</option>
            <option value="NEWEST">Newest to oldest</option>
            <option value="OLDEST">Oldest to newest</option>
          </select>
          <label for="genre">Genre</label>
          <select id="genre">
            <option value="ALL">All genres</option>
          </select>
        </div>
      </div>
      <p class="results__message">Search for a show to see results.</p>
      <div class="shows"></div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>Copyright &copy; 2026 Beau Sterling</p>
      <p>Show data from <a href="https://www.tvmaze.com/api" target="_blank">TVmaze</a></p>
    </div>
  </footer>
</body>
</html>
